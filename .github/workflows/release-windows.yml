name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：填入版本号（如 v0.1.0）会创建同名 Release；留空则只产出构建 artifact"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate application version
        run: pnpm check:release -- --tag="${{ steps.tag.outputs.value }}" --repository="${{ github.repository }}"

      - name: Build Tauri app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: "王源专属记账工作台 ${{ steps.tag.outputs.value }}"
          releaseBody: |
            Windows 安装包（NSIS）已附加在下方 Assets。
            下载 `.exe` 双击运行即可安装。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # tauri-action 在 productName 含 CJK 时无法生成更新清单（"Signature not found
      # for the updater JSON"），且 GitHub 会把上传资产名里的中文清掉。工作流只收集
      # GitHub 实际资产与本地签名；可测试的版本、镜像和清单规则由 release contract
      # module 负责。仅在创建了 Release（tag 非空）时执行。
      - name: Generate & upload updater latest.json
        if: steps.tag.outputs.value != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          $assetsJson = Join-Path $env:RUNNER_TEMP "wangyuan-release-assets.json"
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets
          if ($LASTEXITCODE -ne 0) { throw "failed to read release assets for $tag" }
          $assets | Set-Content -LiteralPath $assetsJson -Encoding utf8NoBOM -NoNewline
          node scripts/release-cli.mjs manifest $tag $env:GITHUB_REPOSITORY $assetsJson src-tauri/target/release/bundle/nsis latest.json
          Write-Host "----- latest.json -----"; Get-Content latest.json -Raw
          gh release upload $tag latest.json --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload installer as workflow artifact
        if: steps.tag.outputs.value == ''
        uses: actions/upload-artifact@v4
        with:
          name: wangyuan-accounting-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
