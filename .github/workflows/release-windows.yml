name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：填入版本号（如 v0.1.0）会创建同名 Release；留空则只产出构建 artifact"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: "王源专属记账工作台 ${{ steps.tag.outputs.value }}"
          releaseBody: |
            Windows 安装包（NSIS）已附加在下方 Assets。
            下载 `.exe` 双击运行即可安装。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # tauri-action 在 productName 含 CJK 时无法生成更新清单（"Signature not found
      # for the updater JSON"），且 GitHub 会把上传资产名里的中文清掉。这里自行用磁盘上
      # 已签名的 .sig + 实际上传的资产名拼出 latest.json，供 updater 的 releases/latest
      # /download/latest.json 端点拉取。仅在创建了 Release（tag 非空）时执行。
      - name: Generate & upload updater latest.json
        if: steps.tag.outputs.value != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          $version = $tag.TrimStart('v')
          $sigFile = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe.sig | Select-Object -First 1
          if (-not $sigFile) { throw "updater signature (*-setup.exe.sig) not found — 确认 createUpdaterArtifacts + 签名密钥已配置" }
          $sig = (Get-Content $sigFile.FullName -Raw).Trim() -replace "`r`n","`n"
          $assetName = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[] | select(.name|endswith("-setup.exe")) | .name'
          if (-not $assetName) { throw "uploaded -setup.exe asset not found on release $tag" }
          # 安装包下载 URL 走 GitHub 加速镜像，这样没有代理的国内用户也能下载更新。
          # latest.json 里每平台只能写一个 url（无 fallback）——若该镜像失效，改这里的
          # $mirror 重新发版即可。清单本身的拉取在 tauri.conf.json 里配了多个镜像端点兜底。
          $mirror = "https://ghfast.top"
          $url = "$mirror/https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$tag/$assetName"
          $obj = [ordered]@{
            version   = $version
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = [ordered]@{ signature = $sig; url = $url } }
          }
          $obj | ConvertTo-Json -Depth 6 | Set-Content -Path latest.json -Encoding utf8 -NoNewline
          Write-Host "----- latest.json -----"; Get-Content latest.json -Raw
          gh release upload $tag latest.json --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload installer as workflow artifact
        if: steps.tag.outputs.value == ''
        uses: actions/upload-artifact@v4
        with:
          name: wangyuan-accounting-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
